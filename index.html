  <style>
    :root{--bg:#050b14;--panel:#0d2033;--ink:#f3eee5;--muted:#9ba7b3;--deep:#6e7c8a;--gold:#e7a846;--gold2:#f2c572;--red:#d85145;--line:#d6e7f71f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#16345144,transparent 32rem),var(--bg);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{min-height:100vh;overflow:hidden;position:relative}.shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(#b4cee109 1px,transparent 1px),linear-gradient(90deg,#b4cee109 1px,transparent 1px);background-size:46px 46px}.wrap{width:min(100% - 64px,1280px);margin:auto;position:relative;z-index:1}.header{height:92px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px}.brand,.nav button,.profile,.login-button,.service,.link,.quiet,.primary,.close,.google-login,.save,.menu{font:inherit;cursor:pointer}.brand{border:0;background:none;display:flex;align-items:center;gap:12px;padding:0}.brand img{width:40px;height:40px;padding:8px;border:1px solid #e7a84666;background:#10263d;clip-path:polygon(50% 0,92% 20%,100% 65%,75% 100%,25% 100%,0 65%,8% 20%);object-fit:contain}.brand span{font:16px "Space Grotesk"}.brand b{color:var(--gold2);font-weight:500}.nav{display:flex;gap:2px;margin-left:auto}.nav button{border:0;background:none;color:var(--muted);padding:12px 11px;font-size:12px;position:relative}.nav button:hover,.nav button.active{color:var(--ink)}.nav button.active:after{content:"";position:absolute;bottom:0;left:11px;right:11px;height:2px;background:var(--gold)}.nav button.maintenance:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin:0 6px 1px 0}.balance{min-width:116px;padding:8px 10px;border:1px solid #e7a84655;background:#152b3ddb;position:relative}.balance small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase}.balance strong{display:block;color:var(--gold2);font:600 17px "Space Grotesk"}.mini{position:absolute;right:7px;bottom:6px;display:flex}.mini img{width:17px;height:17px;object-fit:contain;image-rendering:pixelated;margin-left:-5px}.login-button{min-height:37px;border:1px solid #d6e7f72e;background:#0c1b2ba8;color:var(--ink);padding:0 11px;font-size:11px}.login-button:hover,.profile:hover{border-color:#e7a84673;color:var(--gold2)}.google-g{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:white;color:#4285f4;font:bold 12px Arial;margin-right:5px}.profile{width:37px;height:37px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#0c1b2b}.menu{display:none;border:1px solid var(--line);background:#0c1b2b;color:var(--muted);width:37px;height:37px}.content{min-height:680px}.home{padding:74px 5.5% 80px}.hero{display:grid;grid-template-columns:1fr .9fr;gap:9%;align-items:center;min-height:530px}.eyebrow,.kicker{color:var(--gold2);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.eyebrow:before{content:"";display:inline-block;width:30px;height:1px;background:var(--gold);vertical-align:middle;margin-right:10px}.hero h1,.page h1{font:500 clamp(3.5rem,6.2vw,6.2rem)/.93 "Space Grotesk";letter-spacing:-.075em;margin:20px 0}.hero h1 em,.page h1 em{font-style:normal;color:var(--gold2);font-weight:400}.hero p,.page p{max-width:480px;color:var(--muted);font-size:15px;line-height:1.72}.actions{display:flex;gap:18px;margin-top:32px}.primary{border:0;background:var(--gold2);color:#111a20;font-weight:700;padding:14px 17px;font-size:12px}.quiet,.link{border:0;background:none;color:var(--muted);padding:0;font-size:12px}.quiet:hover,.link:hover{color:var(--gold2)}.meta{display:flex;gap:22px;margin-top:54px;color:var(--deep);font-size:11px}.visual{display:grid;place-items:center;min-height:530px}.frame{width:min(100%,505px);aspect-ratio:.86;overflow:hidden;border:1px solid #a7c6e32b;background:#0b2035;box-shadow:20px 25px 80px #0005;transform:rotate(2deg);position:relative}.frame img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#04090fc0)}.label{position:absolute;z-index:2;top:18px;left:19px;color:#f2c572dd;font-size:9px;letter-spacing:.17em}.frame-bottom{position:absolute;z-index:2;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;color:#f7f1e7d9;font-size:10px}.frame-bottom b{color:var(--gold2);font:15px "Space Grotesk"}.lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}.card{min-height:280px;padding:32px;border:1px solid var(--line);background:linear-gradient(145deg,#0e2033e8,#07101be8)}.card h2,.card h3,.ranking-card h2{font-family:"Space Grotesk";font-weight:500;letter-spacing:-.05em}.card h2{font-size:30px;line-height:1.03;margin:13px 0 16px}.card h2 span{color:var(--gold2)}.card p{max-width:440px;color:var(--muted);font-size:13px;line-height:1.65}.coin-card h3{font-size:23px;margin:9px 0}.total{color:var(--gold2);font:30px "Space Grotesk";margin:17px 0}.total small{color:var(--deep);font:11px "DM Sans"}.coin-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.coin{padding:9px;border:1px solid #d6e7f71a;background:#050d162b}.coin img{float:left;width:27px;height:27px;object-fit:contain;image-rendering:pixelated;margin-right:5px}.coin small{display:block;color:var(--muted);font-size:10px}.coin b{font:15px "Space Grotesk"}.services{display:grid;grid-template-columns:.8fr 1.2fr;gap:10%;align-items:center;padding-top:100px}.services h2{font:500 31px/1.03 "Space Grotesk";letter-spacing:-.05em}.services h2 span{color:var(--gold2)}.service-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.service{min-height:145px;text-align:left;padding:17px 15px;border:1px solid var(--line);background:#0d1c2d88;color:var(--ink)}.service:hover{border-color:#e7a84677;transform:translateY(-3px)}.service small{display:block;color:var(--deep);font-size:10px}.service strong{display:block;margin-top:43px;font:16px "Space Grotesk"}.page{padding:76px 5.5% 90px;min-height:680px}.page h1{max-width:650px}.ranking-top,.account-top,.admin-top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}.ranking-medal,.admin-badge{width:145px;height:145px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--gold2);border:1px solid #e7a84655;background:#e7a8460d;transform:rotate(4deg)}.ranking-medal span,.admin-badge span{font-size:10px;letter-spacing:.18em}.ranking-card,.admin-card{margin-top:40px;border:1px solid var(--line);background:linear-gradient(145deg,#0e2033e8,#07101be8)}.ranking-head{display:flex;justify-content:space-between;padding:27px 30px;border-bottom:1px solid var(--line)}.ranking-head h2{margin:7px 0 0;font-size:24px}.live{color:#9be1b3;font-size:10px}.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#6ccf91;margin-right:7px}.rows{padding:8px 16px 16px}.row{display:grid;grid-template-columns:50px 38px 1fr auto;gap:14px;align-items:center;min-height:64px;padding:8px 14px;border-bottom:1px solid #d6e7f710}.avatar{width:34px;height:34px;display:grid;place-items:center;overflow:hidden;color:var(--gold2);border:1px solid #e7a84644;background:#e7a8460d}.avatar img{width:100%;height:100%;object-fit:cover}.name{display:grid;gap:3px}.name strong{font:14px "Space Grotesk"}.name small{color:var(--deep);font-size:10px}.coins{display:flex;gap:7px;align-items:center;color:var(--gold2);font:17px "Space Grotesk"}.state{min-height:220px;display:grid;place-items:center;color:var(--muted);text-align:center}.account-card{width:min(100%,560px);margin-top:38px;padding:32px;border:1px solid var(--line);background:linear-gradient(145deg,#0e2033e8,#07101be8)}.account-avatar{width:62px;height:62px;display:grid;place-items:center;overflow:hidden;color:var(--gold2);border:1px solid #e7a84655;background:#e7a8460d}.account-avatar img{width:100%;height:100%;object-fit:cover}.email{margin:16px 0 29px;color:var(--deep);font-size:11px;line-height:1.6}.email b{color:var(--ink);font-size:13px;font-weight:500}.field{display:block;margin-bottom:8px;color:var(--gold2);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.input{width:100%;height:45px;padding:0 13px;color:var(--ink);border:1px solid #d6e7f72e;outline:0;background:#050d1677}.input:focus{border-color:#e7a846aa}.hint{color:var(--deep);font-size:10px;margin-top:8px}.save{margin-top:23px;border:0;background:var(--gold2);color:#111a20;padding:13px 16px;font-size:12px;font-weight:700}.message{margin-top:12px;color:#9be1b3;font-size:11px}.admin-list{padding:8px 16px 16px}.admin-row{display:grid;grid-template-columns:42px minmax(160px,1fr) minmax(160px,220px) minmax(180px,280px) 38px;gap:14px;align-items:center;min-height:66px;padding:8px 14px;border-bottom:1px solid #d6e7f710}.admin-coins{display:flex;gap:5px}.coin-input{min-width:0;padding:0 7px;text-align:center}.admin-row .name strong{font-size:12px}.admin-row .name small{font-size:10px}.admin-save{height:36px;border:1px solid #e7a84655;background:#e7a8460d;color:var(--gold2);cursor:pointer}.modal{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#02070dbc;backdrop-filter:blur(10px)}.modal-box{width:min(100%,440px);padding:36px;border:1px solid #e7a84655;background:linear-gradient(145deg,#122940,#071321);box-shadow:0 24px 80px #0008}.close{float:right;border:0;background:none;color:var(--muted);font-size:24px}.modal-logo{width:58px;height:58px;padding:10px;object-fit:contain;border:1px solid #e7a84666;background:#10263d;clip-path:polygon(50% 0,92% 20%,100% 65%,75% 100%,25% 100%,0 65%,8% 20%)}.modal-box h2{font:500 31px/1 "Space Grotesk";letter-spacing:-.06em}.modal-box h2 span{color:var(--gold2)}.modal-box p{color:var(--muted);font-size:13px;line-height:1.65}.google-login{width:100%;height:46px;border:0;background:#f4f6f8;color:#1c2630;font-weight:700;font-size:12px}.error{margin:12px 0;padding:10px;color:#ffc0ba;background:#d8514517;border:1px solid #d8514566;font-size:11px}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--deep);font-size:10px;display:flex;justify-content:space-between}.hide{display:none}@media(max-width:850px){.wrap{width:min(100% - 32px,620px)}.header{height:78px}.brand span,.profile{display:none}.nav{display:none}.menu{display:block;margin-left:0}.balance{margin-left:auto}.hero,.ranking-top,.account-top,.admin-top{grid-template-columns:1fr;display:grid;align-items:start;gap:44px}.hero{padding-top:20px}.lower,.services{grid-template-columns:1fr}.service-list{grid-template-columns:1fr}.service{min-height:110px}.visual{min-height:400px}.frame{width:84%}.page,.home{padding:45px 0 70px}.ranking-medal,.admin-badge{width:110px;height:110px}.ranking-card{margin-top:30px}.ranking-head{padding:23px 20px}.live{display:none}.rows,.admin-list{padding:8px}.row{grid-template-columns:30px 34px 1fr auto;gap:8px;padding:8px 5px}.coins{font-size:14px}.account-card{margin-top:30px;padding:24px 20px}.admin-row{grid-template-columns:28px 1fr 38px;gap:8px;padding:8px 5px}.admin-row .input{grid-column:2}.admin-coins{grid-column:2;display:grid;grid-template-columns:repeat(3,1fr)}.admin-row .admin-save{grid-column:3;grid-row:1/span 2}.footer{flex-direction:column;gap:8px;text-align:center}}

<body>
<div class="shell"><div class="wrap">
<header class="header">
  <button class="brand" onclick="go('inicio')"><img src="assets/logo-cavaleiro.png" alt="Logo"><span>Cavaleiro <b>Sistemas</b></span></button>
  <nav class="nav" id="nav"></nav>
  <div class="balance"><small id="balance-label">Visitante</small><strong id="balance-total">0</strong><div class="mini"><img src="assets/moeda-ouro.png"><img src="assets/moeda-prata.png"><img src="assets/moeda-bronze.png"></div></div>
  <button class="login-button" id="auth-button"><span class="google-g">G</span> Entrar</button><button class="menu" id="menu">☰</button>
</header>
<div id="content"></div>
<footer class="footer"><span>© 2026 Cavaleiro Sistemas</span><span>Construindo o próximo capítulo.</span><span>Feito com intenção ◆</span></footer>
</div></div>
<div class="modal hide" id="login-modal"><section class="modal-box"><button class="close" id="close-modal">×</button><img class="modal-logo" src="assets/logo-cavaleiro.png" alt="Logo"><div class="kicker" style="margin-top:24px">Acesso Cavaleiro</div><h2>Entre para acompanhar<br><span>suas moedas.</span></h2><p>Conecte sua conta Google para salvar seu e-mail, nome público e saldo no Firestore.</p><div id="auth-error" class="error hide"></div><button class="google-login" id="google-login"><span class="google-g">G</span> Continuar com Google</button></section></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDu5arPn3cIcwePvPFQRC6ov2yVIEQEmr8",authDomain:"cavaleiro-1812e.firebaseapp.com",projectId:"cavaleiro-1812e",storageBucket:"cavaleiro-1812e.firebasestorage.app",messagingSenderId:"215768049379",appId:"1:215768049379:web:401c17b8eb1a26831687d6",measurementId:"G-5QHC9WL3M3"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
const ADMIN='wa758833@gmail.com'; const DEFAULT={gold:850,silver:300,bronze:100}; let user=null,profile=null,active='inicio',ranking=[];
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function coinTotal(c){return Number(c?.gold||0)+Number(c?.silver||0)+Number(c?.bronze||0)} function normalizedCoins(c){return {gold:Number(c?.gold||0),silver:Number(c?.silver||0),bronze:Number(c?.bronze||0)}} async function getProfile(u){const snap=await getDoc(doc(db,'users',u.uid));const d=snap.exists()?snap.data():{};return {uid:u.uid,email:d.email||u.email||'',displayName:d.displayName||u.displayName||'Usuário Cavaleiro',photoURL:d.photoURL||u.photoURL||'',coins:normalizedCoins(d.coins||DEFAULT)};}
async function login(){ $('auth-error').classList.add('hide'); try{const result=await signInWithPopup(auth,provider);const ref=doc(db,'users',result.user.uid),snap=await getDoc(ref);const d=snap.exists()?snap.data():{};const coins=normalizedCoins(d.coins||DEFAULT);await setDoc(ref,{uid:result.user.uid,email:result.user.email||'',displayName:d.displayName||result.user.displayName||'Usuário Cavaleiro',photoURL:result.user.photoURL||'',coins,updatedAt:serverTimestamp(),...(snap.exists()?{}:{createdAt:serverTimestamp()})},{merge:true}); $('login-modal').classList.add('hide')}catch(e){$('auth-error').textContent=e.message||'Não foi possível concluir o login.';$('auth-error').classList.remove('hide')}}
async function loadRank(){if(!user){ranking=[];return}const snap=await getDocs(query(collection(db,'users'),limit(100)));ranking=snap.docs.map(x=>{const d=x.data();return {uid:x.id,email:d.email||'',displayName:d.displayName||'Usuário Cavaleiro',photoURL:d.photoURL||'',coins:normalizedCoins(d.coins||DEFAULT)}}).sort((a,b)=>coinTotal(b.coins)-coinTotal(a.coins)).slice(0,20).map((entry,i)=>({...entry,position:i+1}))}
function nav(){const items=[['inicio','⌂','Início'],['musica','♬','Música'],['jogos','⚔','Jogos'],['noticias','▤','Notícias'],['ranking','♜','Ranking']];if(user)items.push(['usuario','◉','Usuário']);if(user&&user.email.toLowerCase()===ADMIN)items.push(['admin','▣','Admin']);$('nav').innerHTML=items.map(x=>`<button class="${active===x[0]?'active':''} ${['musica','jogos','noticias'].includes(x[0])?'maintenance':''}" onclick="window.go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function home(){const c=user?userCoins():{total:0,gold:0,silver:0,bronze:0};return `<main class="home"><section class="hero"><div><div class="eyebrow">Sistemas que abrem caminhos</div><h1>Tecnologia com<br><em>espírito de jornada.</em></h1><p>A Cavaleiro Sistemas cria experiências digitais que aproximam pessoas, ideias e novas possibilidades — com clareza, criatividade e intenção.</p><div class="actions"><button class="primary" onclick="go('noticias')">Conheça a Cavaleiro ↗</button><button class="quiet" onclick="go('musica')">Explorar ›</button></div><div class="meta"><span>♢ Ideias protegidas</span><span>✦ Feito para evoluir</span></div></div><div class="visual"><div class="frame"><span class="label">01 / CAVALEIRO</span><img src="assets/menino-cavaleiro.png" alt="Menino cavaleiro"><div class="frame-bottom"><span>Guardião das possibilidades</span><b>2026</b></div></div></div></section><section class="lower"><article class="card"><div class="kicker">Sobre a empresa</div><h2>O digital pode ser<br><span>mais humano.</span></h2><p>Construímos produtos e experiências com um olhar atento aos detalhes. Aqui, cada sistema tem um propósito: facilitar, inspirar e fazer sentido.</p><button class="link" onclick="go('noticias')">Nossa visão ↗</button></article><article class="card coin-card"><div class="kicker">Carteira do usuário</div><h3>Suas moedas</h3><div class="total">${coinTotal(c).toLocaleString('pt-BR')} <small>unidades</small></div><div class="coin-list">${coin('ouro',c.gold)}${coin('prata',c.silver)}${coin('bronze',c.bronze)}</div><button class="link" onclick="${user?"go('jogos')":"openLogin()"}">${user?'Ver benefícios ↗':'Entrar para acessar benefícios'}</button></article></section><section class="services"><div><div class="kicker">Dentro da casa</div><h2>Um universo em<br><span>construção.</span></h2></div><div class="service-list"><button class="service" onclick="go('musica')"><small>01</small><strong>Música</strong><small>Sons para acompanhar</small></button><button class="service" onclick="go('jogos')"><small>02</small><strong>Jogos</strong><small>Experiências para descobrir</small></button><button class="service" onclick="go('noticias')"><small>03</small><strong>Notícias</strong><small>Novidades da jornada</small></button></div></section></main>`}
function userCoins(){return normalizedCoins(profile?.coins||DEFAULT)}function coin(name,value){return `<div class="coin"><img src="assets/moeda-${name}.png"><small>${name[0].toUpperCase()+name.slice(1)}</small><b>${value}</b></div>`}
function maintenance(title,desc){return `<main class="page"><div class="eyebrow">Em manutenção</div><h1>${title}</h1><p>${desc}</p><div class="card" style="margin-top:35px;width:min(100%,520px)">Esta seção está temporariamente em manutenção.</div></main>`}
function rankingPage(){return `<main class="page"><div class="ranking-top"><div><div class="eyebrow">Classificação da comunidade</div><h1>Quem está<br><em>no topo?</em></h1><p>Uma visão geral dos usuários com mais moedas na Cavaleiro Sistemas.</p></div><div class="ranking-medal">♜<span>TOP 20</span></div></div><section class="ranking-card"><div class="ranking-head"><div><div class="kicker">Ranking de moedas</div><h2>Os guardiões do saldo</h2></div><span class="live">Firestore ao vivo</span></div>${!user?'<div class="state">Entre com Google para visualizar o ranking.</div>':ranking.length?`<div class="rows">${ranking.map(r=>`<div class="row"><span>${String(r.position).padStart(2,'0')}</span><div class="avatar">${r.photoURL?`<img src="${esc(r.photoURL)}">`:'◉'}</div><div class="name"><strong>${esc(r.displayName)}</strong><small>${esc(r.email)}</small></div><div class="coins">◉ ${coinTotal(r.coins).toLocaleString('pt-BR')}</div></div>`).join('')}</div>`:'<div class="state">Ainda não há usuários no ranking.</div>'}</section></main>`}
function userPage(){return `<main class="page"><div class="account-top"><div><div class="eyebrow">Seu espaço</div><h1>Como você quer<br><em>ser lembrado?</em></h1><p>Escolha o nome público que aparecerá no ranking de moedas.</p></div></div><section class="account-card"><div class="account-avatar">${profile.photoURL?`<img src="${esc(profile.photoURL)}">`:'◉'}</div><div class="email">Conta conectada<br><b>${esc(profile.email)}</b></div><label class="field">Nome público do ranking</label><input id="public-name" class="input" maxlength="32" value="${esc(profile.displayName)}"><div class="hint">Use de 2 a 32 caracteres. Seu e-mail não será exibido como nome.</div><button class="save" onclick="saveName()">Salvar nome</button><div id="user-message"></div></section></main>`}
function adminPage(){return `<main class="page"><div class="admin-top"><div><div class="eyebrow">Área restrita</div><h1>Gestão do<br><em>ranking.</em></h1><p>Painel exclusivo para wa758833@gmail.com editar nomes públicos e moedas dos participantes.</p></div><div class="admin-badge">♜<span>ADMIN</span></div></div><section class="admin-card"><div class="ranking-head"><div><div class="kicker">Usuários no Firestore</div><h2>Controle de nomes públicos</h2></div><button class="link" onclick="go('admin')">Atualizar</button></div><div class="admin-list">${ranking.map(r=>`<div class="admin-row"><span>${String(r.position).padStart(2,'0')}</span><div class="name"><strong>${esc(r.email)}</strong><small>${coinTotal(r.coins).toLocaleString('pt-BR')} moedas</small></div><input id="name-${r.uid}" class="input" value="${esc(r.displayName)}"><div class="admin-coins"><input id="gold-${r.uid}" class="input coin-input" type="number" min="0" value="${r.coins.gold}" aria-label="Ouro"><input id="silver-${r.uid}" class="input coin-input" type="number" min="0" value="${r.coins.silver}" aria-label="Prata"><input id="bronze-${r.uid}" class="input coin-input" type="number" min="0" value="${r.coins.bronze}" aria-label="Bronze"></div><button class="admin-save" onclick="adminSave('${r.uid}')">✓</button></div>`).join('')||'<div class="state">Nenhum usuário carregado.</div>'}</div><div id="admin-message"></div></section></main>`}
window.go=async function(page){active=page;nav();if(page==='ranking'||page==='admin'){try{await loadRank()}catch(e){ranking=[]}}render()};window.openLogin=()=>$('login-modal').classList.remove('hide');window.saveName=async()=>{const input=$('public-name'),name=input.value.trim();if(name.length<2)return $('user-message').textContent='Use pelo menos 2 caracteres.';await setDoc(doc(db,'users',user.uid),{displayName:name,updatedAt:serverTimestamp()},{merge:true});profile=await getProfile(user);$('user-message').textContent='Nome atualizado no ranking.';render()};window.adminSave=async uid=>{const name=$('name-'+uid).value.trim();const coins={gold:Math.max(0,Number($('gold-'+uid).value||0)),silver:Math.max(0,Number($('silver-'+uid).value||0)),bronze:Math.max(0,Number($('bronze-'+uid).value||0))};await setDoc(doc(db,'users',uid),{displayName:name,coins,updatedAt:serverTimestamp()},{merge:true});$('admin-message').textContent='Nome e moedas atualizados.';await loadRank();render()};function render(){nav();$('content').innerHTML=active==='inicio'?home():active==='ranking'?rankingPage():active==='usuario'&&user?userPage():active==='admin'&&user&&user.email.toLowerCase()===ADMIN?adminPage():active==='musica'?maintenance('A trilha sonora está chegando.','Estamos preparando uma experiência de música com curadoria, novidades e momentos para acompanhar sua jornada.'):active==='jogos'?maintenance('Novas aventuras estão a caminho.','A área de jogos está sendo construída com cuidado.'):maintenance('Informação com o nosso jeito.','Estamos organizando a central de notícias da Cavaleiro Sistemas para reunir novidades, bastidores e comunicados.');$('balance-label').textContent=user?'Seu saldo':'Visitante';$('balance-total').textContent=user?coinTotal(userCoins()).toLocaleString('pt-BR'):'0';$('auth-button').innerHTML=user?'Sair':'<span class="google-g">G</span> Entrar'}
$('google-login').onclick=login;$('close-modal').onclick=()=> $('login-modal').classList.add('hide');$('auth-button').onclick=()=>user?signOut(auth):openLogin();$('menu').onclick=()=>document.querySelector('.nav').classList.toggle('show');onAuthStateChanged(auth,async u=>{user=u;profile=u?await getProfile(u):null;if(!u)active='inicio';render()});render();
</script>
</body></html>
